services:
  postgres:
    image: postgres:16
    container_name: ha-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /srv/ha-stack/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ha-network

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - TZ=${TZ}
    devices:
      - ${HOMEASSISTANT_ZIGBEE_DEVICE:-/dev/null}:${HOMEASSISTANT_ZIGBEE_DEVICE:-/dev/null}
    volumes:
      - /srv/ha-stack/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/udev:/run/udev:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8123/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  caddy:
    profiles: ["caddy"]
    image: caddy:2
    container_name: ha-caddy
    restart: unless-stopped
    # Caddy ne démarre qu'une fois Home Assistant *healthy*.
    # depends_on est de l'orchestration pure : il fonctionne même si HA est en
    # network_mode: host et Caddy sur le bridge. Combiné au health_check côté
    # Caddyfile, ça supprime la fenêtre de 502 au démarrage de la stack.
    depends_on:
      homeassistant:
        condition: service_healthy
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/ha-stack/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/ha-stack/caddy/data:/data
      - /srv/ha-stack/caddy/config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || curl -fsS http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ha-network

  mqtt:
    profiles: ["zigbee2mqtt"]
    image: eclipse-mosquitto:2
    container_name: ha-mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - /srv/ha-stack/mosquitto/config:/mosquitto/config
      - /srv/ha-stack/mosquitto/data:/mosquitto/data
      - /srv/ha-stack/mosquitto/log:/mosquitto/log
    networks:
      - ha-network

  zigbee2mqtt:
    profiles: ["zigbee2mqtt"]
    image: ghcr.io/koenkk/zigbee2mqtt:latest
    container_name: ha-zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      - TZ=${TZ}
    devices:
      - ${ZIGBEE_SERIAL_PORT:-/dev/ttyUSB0}:${ZIGBEE_SERIAL_PORT:-/dev/ttyUSB0}
    volumes:
      - /srv/ha-stack/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "127.0.0.1:8099:8080"
    privileged: true
    networks:
      - ha-network

networks:
  ha-network:
    driver: bridge
    # Sous-réseau FIGÉ (au lieu de laisser Docker attribuer 172.18/172.19/...).
    # Doit rester cohérent avec DOCKER_SUBNET (.env) et detect_docker_subnet()
    # dans scripts/lib/ha.sh, qui alimente trusted_proxies de Home Assistant.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
